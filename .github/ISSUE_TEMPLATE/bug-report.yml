name: Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description and Versions
      description: A clear and concise description of what the bug is. Also name the Obisidan and plugin version you are using.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: List the steps needed. to reproduce the bug as good as possible.
    validations:
      required: true
  - type: textarea
    id: debug-logs
    attributes:
      label: Full Debug Output
      description: Paste the complete debug output here. Do not truncate the logs.
      render: shell
    validations:
      required: true
